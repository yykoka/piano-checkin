<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎹 练琴打卡 - 小小音乐家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #FFE5B4 0%, #FFB6C1 50%, #DDA0DD 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }
        
        .header {
            text-align: center;
            color: #fff;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        /* 积分板 */
        .score-board {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 25px;
            padding: 12px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(255, 165, 0, 0.4);
            margin-bottom: 20px;
            border: 3px solid #fff;
        }
        
        .star {
            font-size: 36px;
            animation: twinkle 1.5s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.3) rotate(10deg); }
        }
        
        .score-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .score-label {
            font-size: 14px;
            color: #8B4513;
            font-weight: bold;
        }
        
        .score-number {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }
        
        /* 翻转卡片 */
        .card-container {
            perspective: 1000px;
            width: 300px;
            height: 400px;
            margin-bottom: 20px;
        }
        
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
        }
        
        .card.flipped {
            transform: rotateY(180deg);
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            padding: 25px;
            border: 5px solid #fff;
        }
        
        /* 正面 */
        .card-front {
            background: linear-gradient(135deg, #FF6B6B 0%, #FFE66D 100%);
            color: #fff;
        }
        
        .piano-icon {
            font-size: 100px;
            margin-bottom: 15px;
            animation: bounce 1s infinite;
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.1));
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .card-front h2 {
            font-size: 26px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }
        
        .card-front p {
            font-size: 15px;
            opacity: 0.95;
            text-align: center;
        }
        
        .streak-box {
            background: rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 16px;
        }
        
        .streak-number {
            font-size: 28px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }
        
        .tap-hint {
            margin-top: 20px;
            font-size: 14px;
            background: rgba(255,255,255,0.25);
            padding: 10px 20px;
            border-radius: 25px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        
        /* 背面 */
        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            transform: rotateY(180deg);
        }
        
        .success-icon {
            font-size: 70px;
            margin-bottom: 10px;
            animation: rotate 2s infinite;
        }
        
        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(10deg); }
        }
        
        .card-back h2 {
            font-size: 28px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }
        
        .practice-box {
            background: rgba(255,255,255,0.2);
            padding: 15px 30px;
            border-radius: 20px;
            margin-bottom: 15px;
        }
        
        .practice-time {
            font-size: 48px;
            font-weight: bold;
        }
        
        .practice-label {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .points-earned {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #8B4513;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        /* 按钮 */
        .check-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
            border: none;
            padding: 18px 60px;
            font-size: 22px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(17, 153, 142, 0.4);
            transition: all 0.3s ease;
            display: none;
            font-weight: bold;
            border: 3px solid #fff;
        }
        
        .check-btn.show {
            display: block;
        }
        
        .check-btn:active {
            transform: scale(0.95);
        }
        
        /* 已打卡状态 */
        .completed-badge {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            display: none;
            box-shadow: 0 8px 25px rgba(17, 153, 142, 0.4);
            animation: popIn 0.5s ease;
            border: 3px solid #fff;
        }
        
        .completed-badge.show {
            display: block;
        }
        
        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        /* 日历 */
        .calendar {
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border: 3px solid #FFE4B5;
        }
        
        .calendar h3 {
            text-align: center;
            margin-bottom: 15px;
            color: #FF6B6B;
            font-size: 18px;
        }
        
        .week-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        
        .week-day {
            font-size: 13px;
            color: #999;
            padding: 5px;
            font-weight: bold;
        }
        
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        
        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 14px;
            color: #666;
            background: #f5f5f5;
            font-weight: bold;
        }
        
        .day.checked {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }
        
        .day.today {
            border: 3px solid #FF6B6B;
        }
        
        /* 奖励弹窗 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            z-index: 999;
        }
        
        .overlay.show {
            display: block;
        }
        
        .reward-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            padding: 35px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 5px solid #fff;
            max-width: 280px;
        }
        
        .reward-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }
        
        .reward-popup .emoji {
            font-size: 70px;
            margin-bottom: 15px;
            animation: bounce 0.5s infinite;
        }
        
        .reward-popup h3 {
            color: #8B4513;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .reward-popup p {
            color: #666;
            font-size: 16px;
        }
        
        .close-btn {
            background: #fff;
            color: #FFA500;
            border: none;
            padding: 12px 35px;
            border-radius: 25px;
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 标题 -->
    <div class="header">
        <h1>🎹 练琴打卡</h1>
        <p>坚持练习，成为小小钢琴家</p>
    </div>
    
    <!-- 积分板 -->
    <div class="score-board">
        <span class="star">⭐</span>
        <div class="score-info">
            <span class="score-label">我的积分</span>
            <span class="score-number" id="totalScore">0</span>
        </div>
    </div>
    
    <!-- 翻转卡片 -->
    <div class="card-container">
        <div class="card" id="checkCard">
            <!-- 正面 -->
            <div class="card-face card-front">
                <div class="piano-icon">🎹</div>
                <h2>今天要练琴吗？</h2>
                <p>每天练习30分钟</p>
                <div class="streak-box">
                    🔥 连续打卡 <span class="streak-number" id="streakDays">0</span> 天
                </div>
                <div class="tap-hint">👆 点我打卡</div>
            </div>
            
            <!-- 背面 -->
            <div class="card-face card-back">
                <div class="success-icon">🎉</div>
                <h2>太棒了！</h2>
                <div class="practice-box">
                    <div class="practice-time">30</div>
                    <div class="practice-label">分钟</div>
                </div>
                <div class="points-earned">+10 积分</div>
            </div>
        </div>
    </div>
    
    <!-- 打卡按钮 -->
    <button class="check-btn" id="checkBtn" onclick="checkIn()">
        ✨ 确认打卡
    </button>
    
    <!-- 已打卡徽章 -->
    <div class="completed-badge" id="completedBadge">
        ✅ 今日已完成
    </div>
    
    <!-- 日历 -->
    <div class="calendar">
        <h3>📅 本月打卡日历</h3>
        <div class="week-days">
            <span class="week-day">日</span>
            <span class="week-day">一</span>
            <span class="week-day">二</span>
            <span class="week-day">三</span>
            <span class="week-day">四</span>
            <span class="week-day">五</span>
            <span class="week-day">六</span>
        </div>
        <div class="days" id="calendarDays"></div>
    </div>
    
    <!-- 奖励弹窗 -->
    <div class="overlay" id="overlay" onclick="closeReward()"></div>
    <div class="reward-popup" id="rewardPopup">
        <div class="emoji" id="rewardEmoji">🎁</div>
        <h3 id="rewardTitle">获得奖励！</h3>
        <p id="rewardText">继续加油哦！</p>
        <button class="close-btn" onclick="closeReward()">太棒了！</button>
    </div>

    <script>
        // 数据存储
        let score = parseInt(localStorage.getItem('pianoScore') || '0');
        let streak = parseInt(localStorage.getItem('pianoStreak') || '0');
        let lastCheckDate = localStorage.getItem('lastCheckDate');
        let checkRecords = JSON.parse(localStorage.getItem('checkRecords') || '[]');
        
        // 初始化显示
        document.getElementById('totalScore').textContent = score;
        document.getElementById('streakDays').textContent = streak;
        
        // 检查今日是否已打卡
        const today = new Date().toDateString();
        const isCheckedToday = lastCheckDate === today;
        
        if (isCheckedToday) {
            document.getElementById('checkCard').classList.add('flipped');
            document.getElementById('completedBadge').classList.add('show');
        }
        
        // 卡片翻转
        const card = document.getElementById('checkCard');
        const checkBtn = document.getElementById('checkBtn');
        
        card.addEventListener('click', function() {
            if (!isCheckedToday && !this.classList.contains('flipped')) {
                this.classList.add('flipped');
                setTimeout(() => {
                    checkBtn.classList.add('show');
                }, 400);
            }
        });
        
        // 打卡功能
        function checkIn() {
            const today = new Date().toDateString();
            
            // 更新积分
            score += 10;
            
            // 更新连续打卡
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            if (lastCheckDate === yesterday.toDateString()) {
                streak += 1;
            } else {
                streak = 1;
            }
            
            // 保存数据
            localStorage.setItem('pianoScore', score);
            localStorage.setItem('pianoStreak', streak);
            localStorage.setItem('lastCheckDate', today);
            
            const record = {
                date: new Date().toISOString(),
                score: 10,
                duration: 30
            };
            checkRecords.push(record);
            localStorage.setItem('checkRecords', JSON.stringify(checkRecords));
            
            // 更新显示
            document.getElementById('totalScore').textContent = score;
            document.getElementById('streakDays').textContent = streak;
            checkBtn.classList.remove('show');
            document.getElementById('completedBadge').classList.add('show');
            
            // 显示奖励
            showReward();
            
            // 更新日历
            renderCalendar();
        }
        
        // 显示奖励
        function showReward() {
            const rewards = [
                { emoji: '🎵', title: '音符小达人', text: '获得10积分！' },
                { emoji: '🌟', title: '练琴小明星', text: '今天表现真棒！' },
                { emoji: '🏆', title: '坚持小勇士', text: '继续保持哦！' },
                { emoji: '🎹', title: '小小钢琴家', text: '进步看得见！' },
                { emoji: '🌈', title: '音乐小天使', text: '琴声真美妙！' }
            ];
            
            const reward = rewards[Math.floor(Math.random() * rewards.length)];
            document.getElementById('rewardEmoji').textContent = reward.emoji;
            document.getElementById('rewardTitle').textContent = reward.title;
            document.getElementById('rewardText').textContent = reward.text;
            
            document.getElementById('overlay').classList.add('show');
            document.getElementById('rewardPopup').classList.add('show');
        }
        
        // 关闭奖励
        function closeReward() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('rewardPopup').classList.remove('show');
        }
        
        // 渲染日历
        function renderCalendar() {
            const container = document.getElementById('calendarDays');
            container.innerHTML = '';
            
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // 空白填充
            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                container.appendChild(empty);
            }
            
            // 日期
            for (let day = 1; day <= daysInMonth; day++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'day';
                dayEl.textContent = day;
                
                // 检查是否已打卡
                const dateStr = new Date(year, month, day).toDateString();
                const isChecked = checkRecords.some(r => 
                    new Date(r.date).toDateString() === dateStr
                );
                
                if (isChecked) {
                    dayEl.classList.add('checked');
                    dayEl.textContent = '✓';
                }
                
                // 标记今天
                if (day === now.getDate()) {
                    dayEl.classList.add('today');
                }
                
                container.appendChild(dayEl);
            }
        }
        
        // 初始化日历
        renderCalendar();
    </script>
</body>
</html>
