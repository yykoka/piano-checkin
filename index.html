<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐙 小小音乐家探险队</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 30%, #0093E9 60%, #2C3E50 100%);
            background-size: 400% 400%;
            animation: oceanBg 15s ease infinite;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }
        
        @keyframes oceanBg {
            0% { background-position: 0% 0%; }
            50% { background-position: 0% 100%; }
            100% { background-position: 0% 0%; }
        }
        
        /* 海底气泡动画 */
        .bubble {
            position: fixed;
            bottom: -50px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: rise 8s infinite ease-in;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
        }
        
        /* 小鱼游动 - 从左向右 */
        .fish-right {
            position: fixed;
            font-size: 40px;
            animation: swimRight 15s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes swimRight {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }
        
        /* 小鱼游动 - 从右向左（翻转） */
        .fish-left {
            position: fixed;
            font-size: 40px;
            animation: swimLeft 18s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes swimLeft {
            0% { transform: translateX(calc(100vw + 100px)) scaleX(-1); }
            100% { transform: translateX(-100px) scaleX(-1); }
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        /* 标题动画 */
        .header {
            text-align: center;
            color: #fff;
            margin-bottom: 15px;
            animation: titleBounce 2s ease infinite;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        @keyframes titleBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .header h1 {
            font-size: 22px;
            background: linear-gradient(90deg, #fff, #a8edea, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }
        
        .header .subtitle {
            font-size: 14px;
            color: #a8edea;
            margin-top: 5px;
        }
        
        /* 探险队徽章 */
        .badge-octonauts {
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 40px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        
        /* 等级卡片 - 章鱼堡风格 */
        .level-card {
            display: none;
        }
        
        .exp-bar {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            height: 15px;
            overflow: hidden;
        }
        
        .exp-fill {
            height: 100%;
            background: linear-gradient(90deg, #00c9ff, #0093E9, #4facfe);
            border-radius: 10px;
            transition: width 0.5s;
        }
        
        /* 任务卡片 - 呱唧风格 */
        .task-card {
            display: none;
        }

        /* 积分和等级卡片 */
        .score-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(168,237,234,0.5));
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 3px solid #00c9ff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
            color: #0066cc;
        }

        .daily-score, .total-score {
            background: rgba(0,201,255,0.1);
            padding: 8px 15px;
            border-radius: 15px;
            font-weight: bold;
        }

        .daily-score span, .total-score span {
            color: #e17055;
            font-size: 18px;
        }

        .level-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .level-display span:first-child {
            font-size: 18px;
            color: #0066cc;
            font-weight: bold;
        }

        .level-progress {
            background: linear-gradient(135deg, #00c9ff, #0093E9);
            color: #fff;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
        }

        /* 奖励进度卡片 */
        .rewards-card {
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 3px solid #e17055;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .rewards-card h3 {
            color: #d63031;
            text-align: center;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .rewards-track {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .reward-item {
            text-align: center;
            opacity: 0.4;
            transition: all 0.3s;
        }

        .reward-item.unlocked {
            opacity: 1;
            animation: rewardPop 0.6s ease;
        }

        @keyframes rewardPop {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .reward-icon {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .reward-item.unlocked .reward-icon {
            animation: float 2s ease-in-out infinite;
        }

        .reward-name {
            font-size: 12px;
            color: #d63031;
            font-weight: bold;
        }

        .reward-score {
            font-size: 10px;
            color: #e17055;
        }

        /* 时间选择卡片 */
        .timer-select-card {
            background: linear-gradient(135deg, #a8e6cf, #88d8b0);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 3px solid #00b894;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .timer-select-card h3 {
            color: #2d3436;
            text-align: center;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .time-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .time-btn {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
            border: none;
            padding: 15px 10px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #fff;
            transition: all 0.3s;
            line-height: 1.4;
        }

        .time-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,184,148,0.4);
        }

        .time-btn:active {
            transform: scale(0.95);
        }

        .time-btn:disabled {
            background: #b2bec3;
            cursor: not-allowed;
            transform: none;
        }

        .time-hint {
            text-align: center;
            color: #2d3436;
            font-size: 12px;
            margin-top: 10px;
            opacity: 0.8;
        }

        /* 日历提示 */
        .calendar-hint {
            text-align: center;
            color: #0066cc;
            font-size: 12px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        /* 积分增加动画 */
        @keyframes scorePop {
            0% { transform: scale(1); }
            30% { transform: scale(1.5); color: #ffd93d; }
            60% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        
        .score-animate {
            animation: scorePop 0.6s ease;
        }
        
        /* 积分飘浮动画 */
        @keyframes floatUp {
            0% { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
            100% { 
                opacity: 0; 
                transform: translateY(-50px) scale(1.5); 
            }
        }
        
        .score-float {
            position: fixed;
            font-size: 24px;
            font-weight: bold;
            color: #ffd93d;
            pointer-events: none;
            z-index: 1000;
            animation: floatUp 1s ease forwards;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 14px;
            background: #e8e8e8;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cal-day:hover {
            background: #d0d0d0;
            transform: scale(1.1);
        }

        .cal-day.checked {
            background: linear-gradient(135deg, #ffd93d, #ff6b6b);
            color: #fff;
            font-weight: bold;
        }

        .cal-day.today {
            border: 3px solid #9b59b6;
        }
        
        .task-card::before {
            content: '';
        }
        
        .task-card .character-img {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            width: 75px;
            height: 75px;
            object-fit: contain;
            animation: kwaziiBounce 2s infinite;
            z-index: 2;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }
        
        @keyframes kwaziiBounce {
            0%, 100% { transform: translateY(-50%) rotate(-10deg); }
            50% { transform: translateY(-50%) rotate(10deg) scale(1.1); }
        }
        
        .task-card h3 {
            color: #d63031;
            margin-bottom: 10px;
            text-align: center;
            padding-left: 80px;
            font-size: 18px;
        }
        
        .task-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e17055;
            border-radius: 15px;
            font-size: 14px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.9);
        }
        
        .task-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding-left: 80px;
        }
        
        .chip {
            background: #fff;
            color: #e17055;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            border: 2px solid #e17055;
            transition: all 0.3s;
        }
        
        .chip:hover {
            background: #e17055;
            color: #fff;
            transform: scale(1.1);
        }
        
        /* 计时器 - 皮医生风格 */
        .timer-card {
            background: linear-gradient(135deg, #a8e6cf, #88d8b0);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 15px;
            border: 3px solid #00b894;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .timer-card::before {
            content: '';
        }
        
        .timer-card .character-img {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: 80px;
            height: 80px;
            object-fit: contain;
            animation: pesoWaddle 2s ease-in-out infinite;
            z-index: 2;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }
        
        @keyframes pesoWaddle {
            0%, 100% { transform: translateY(-50%) rotate(-5deg); }
            50% { transform: translateY(-50%) rotate(5deg) scale(1.05); }
        }
        
        .timer-display {
            font-size: 48px;
            font-weight: bold;
            color: #2d3436;
            font-family: monospace;
            margin-bottom: 15px;
            margin-right: 80px;
        }
        
        .timer-display.running {
            animation: pulse 1s infinite;
            color: #00b894;
        }
        
        .timer-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-right: 90px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: 3px solid #fff;
            transition: transform 0.2s;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-start {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
        }
        
        .btn-finish {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
        }
        
        /* 徽章 - 巴克队长风格 */
        .badges-card {
            display: none;
        }
        
        /* 庆祝弹窗 */
        .celebrate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .celebrate.show {
            display: flex;
        }
        
        .celebrate-content {
            text-align: center;
            color: #fff;
        }
        
        .celebrate-emoji {
            font-size: 80px;
            animation: dance 1s infinite;
        }
        
        @keyframes dance {
            0%, 100% { transform: rotate(-10deg) translateY(0); }
            50% { transform: rotate(10deg) translateY(-20px); }
        }
        
        .celebrate h2 {
            font-size: 28px;
            color: #ffd93d;
            margin: 20px 0;
        }
        
        .celebrate button {
            background: linear-gradient(135deg, #ffd93d, #ff6b6b);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            border: 3px solid #fff;
        }
        
        /* 日历 - 海洋风格 */
        .calendar-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(168,237,234,0.5));
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 3px solid #00c9ff;
            position: relative;
            overflow: hidden;
        }
        
        .calendar-card::before {
            content: '';
        }
        
        .calendar-card .character-img {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: 75px;
            height: 75px;
            object-fit: contain;
            animation: wave 2s ease-in-out infinite;
            z-index: 2;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }
        
        @keyframes wave {
            0%, 100% { transform: translateY(-50%) rotate(0deg); }
            50% { transform: translateY(-50%) rotate(10deg) scale(1.1); }
        }
        
        .calendar-card h3 {
            color: #0066cc;
            text-align: center;
            margin-bottom: 10px;
            padding-right: 80px;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
            padding-right: 80px;
        }
        
        .cal-header {
            font-size: 12px;
            color: #666;
            font-weight: bold;
            padding: 5px;
        }
        
        .cal-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 14px;
            background: #e8e8e8;
            color: #666;
        }
        
        .cal-day.checked {
            background: linear-gradient(135deg, #ffd93d, #ff6b6b);
            color: #fff;
            font-weight: bold;
        }
        
        .cal-day.today {
            border: 2px solid #9b59b6;
        }
        
        /* 同步按钮 - 谢灵通风格 */
        .sync-card {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 3px solid #fff;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .sync-card::before {
            content: '';
        }
        
        .sync-card .character-img {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            width: 75px;
            height: 75px;
            object-fit: contain;
            animation: shellingtonWave 2s ease-in-out infinite;
            z-index: 2;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }
        
        @keyframes shellingtonWave {
            0%, 100% { transform: translateY(-50%) rotate(0deg); }
            25% { transform: translateY(-50%) rotate(-15deg) scale(1.1); }
            75% { transform: translateY(-50%) rotate(15deg) scale(1.1); }
        }
        
        .sync-btn {
            background: #fff;
            color: #e84393;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            width: calc(100% - 90px);
            margin-left: 90px;
        }
        
        .sync-btn:active {
            transform: scale(0.98);
        }
        
        /* 导出弹窗 */
        .export-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        
        .export-modal.show {
            display: flex;
        }
        
        .export-content {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
        }
        
        .export-content h3 {
            color: #0984e3;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .export-textarea {
            width: 100%;
            height: 120px;
            border: 2px solid #74b9ff;
            border-radius: 10px;
            padding: 10px;
            font-size: 12px;
            resize: none;
            margin-bottom: 10px;
        }
        
        .export-btns {
            display: flex;
            gap: 10px;
        }
        
        .export-btns button {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-copy {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: #fff;
        }
        
        .btn-close {
            background: #e0e0e0;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐙 小小音乐家探险队</h1>
            <div class="subtitle">🌊 和海底小纵队一起探索音乐世界！</div>
        </div>
        
        <!-- 积分和等级卡片 -->
        <div class="score-card">
            <div class="score-header">
                <div class="daily-score">今日积分: <span id="dailyScore">0</span>/10</div>
                <div class="total-score">累计积分: <span id="totalScore">0</span></div>
            </div>
            <div class="level-display">
                <span id="currentLevel">🌱 音乐小苗</span>
                <span class="level-progress">Lv.<span id="levelNum">1</span></span>
            </div>
            <div class="exp-bar">
                <div class="exp-fill" id="expFill" style="width: 0%"></div>
            </div>
        </div>

        <!-- 我的奖励 -->
        <div class="rewards-card">
            <h3>🏆 我的奖励</h3>
            <div class="rewards-track">
                <div class="reward-item" data-score="0">
                    <div class="reward-icon" id="reward0">🌱</div>
                    <div class="reward-name">小芽</div>
                    <div class="reward-score">0分</div>
                </div>
                <div class="reward-item" data-score="30">
                    <div class="reward-icon" id="reward30">🌿</div>
                    <div class="reward-name">嫩苗</div>
                    <div class="reward-score">30分</div>
                </div>
                <div class="reward-item" data-score="60">
                    <div class="reward-icon" id="reward60">🌸</div>
                    <div class="reward-name">红花</div>
                    <div class="reward-score">60分</div>
                </div>
                <div class="reward-item" data-score="100">
                    <div class="reward-icon" id="reward100">🏆</div>
                    <div class="reward-name">奖杯</div>
                    <div class="reward-score">100分</div>
                </div>
                <div class="reward-item" data-score="200">
                    <div class="reward-icon" id="reward200">👑</div>
                    <div class="reward-name">皇冠</div>
                    <div class="reward-score">200分</div>
                </div>
                <div class="reward-item" data-score="500">
                    <div class="reward-icon" id="reward500">💎</div>
                    <div class="reward-name">钻石</div>
                    <div class="reward-score">500分</div>
                </div>
                <div class="reward-item" data-score="1000">
                    <div class="reward-icon" id="reward1000">🌟</div>
                    <div class="reward-name">明星</div>
                    <div class="reward-score">1000分</div>
                </div>
            </div>
        </div>
        
        <!-- 时间选择 -->
        <div class="timer-select-card">
            <h3>⏱️ 练习时长</h3>
            <div class="time-buttons">
                <button class="time-btn" onclick="addPractice(5)">5分钟<br>+5分</button>
                <button class="time-btn" onclick="addPractice(10)">10分钟<br>+10分</button>
                <button class="time-btn" onclick="addPractice(15)">15分钟<br>+10分</button>
                <button class="time-btn" onclick="addPractice(20)">20分钟<br>+10分</button>
                <button class="time-btn" onclick="addPractice(25)">25分钟<br>+10分</button>
                <button class="time-btn" onclick="addPractice(30)">30分钟<br>+10分</button>
            </div>
            <p class="time-hint">每天最多获得10积分，超出部分不累计</p>
        </div>
        
        <!-- 日历 -->
        <div class="calendar-card">
            <h3>📅 练习日历</h3>
            <p class="calendar-hint">点击日期可补打卡或取消打卡</p>
            <div class="calendar-grid" id="calendar">
                <div class="cal-header">日</div>
                <div class="cal-header">一</div>
                <div class="cal-header">二</div>
                <div class="cal-header">三</div>
                <div class="cal-header">四</div>
                <div class="cal-header">五</div>
                <div class="cal-header">六</div>
            </div>
        </div>

        <!-- 同步按钮 -->
        <div class="sync-card">
            <img src="shellington.png" alt="谢灵通" class="character-img" onerror="this.style.display='none'">
            <button class="sync-btn" onclick="showExport()">☁️ 同步到飞书</button>
        </div>
    </div>
    
    <div class="celebrate" id="celebrate">
        <div class="celebrate-content">
            <div class="celebrate-emoji">🐙🌊🐠</div>
            <h2 id="celebrateTitle">探险升级！</h2>
            <p id="celebrateText">恭喜你成为虎鲨艇驾驶员！</p>
            <button onclick="closeCelebrate()">继续探险 🐙</button>
        </div>
    </div>
    
    <!-- 导出弹窗 -->
    <div class="export-modal" id="exportModal">
        <div class="export-content">
            <h3>📋 复制到飞书表格</h3>
            <textarea class="export-textarea" id="exportData" readonly></textarea>
            <div class="export-btns">
                <button class="btn-copy" onclick="copyData()">📋 复制</button>
                <button class="btn-close" onclick="closeExport()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // 奖励配置（也是等级）
        const rewards = [
            { score: 0, icon: '🌱', name: '小芽', title: '音乐小芽' },
            { score: 30, icon: '🌿', name: '嫩苗', title: '音乐嫩苗' },
            { score: 60, icon: '🌸', name: '红花', title: '音乐红花' },
            { score: 100, icon: '🏆', name: '奖杯', title: '音乐奖杯' },
            { score: 200, icon: '👑', name: '皇冠', title: '音乐皇冠' },
            { score: 500, icon: '💎', name: '钻石', title: '音乐钻石' },
            { score: 1000, icon: '🌟', name: '明星', title: '音乐明星' }
        ];
        
        let totalScore = parseInt(localStorage.getItem('totalScore') || '0');
        let dailyScore = parseInt(localStorage.getItem('dailyScore') || '0');
        let lastPracticeDate = localStorage.getItem('lastPracticeDate') || '';
        let practiceRecords = JSON.parse(localStorage.getItem('practiceRecords') || '[]');
        
        // 检查是否新的一天，重置每日积分
        function checkNewDay() {
            const today = new Date().toISOString().split('T')[0];
            if (lastPracticeDate !== today) {
                dailyScore = 0;
                localStorage.setItem('dailyScore', '0');
                lastPracticeDate = today;
                localStorage.setItem('lastPracticeDate', today);
            }
        }
        
        checkNewDay();
        updateDisplay();
        renderCalendar();
        updateRewards();
        
        // 创建海底气泡动画
        function createBubbles() {
            const bubbleCount = 15;
            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 20 + 10;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + 'vw';
                bubble.style.animationDelay = Math.random() * 8 + 's';
                bubble.style.animationDuration = (Math.random() * 4 + 6) + 's';
                document.body.appendChild(bubble);
            }
        }
        
        // 创建小鱼游动
        function createFish() {
            const fishTypes = ['🐠', '🐟', '🐡', '🦈', '🐬', '🐳', '🐋'];
            
            for (let i = 0; i < 4; i++) {
                const fish = document.createElement('div');
                fish.className = 'fish-right';
                fish.textContent = fishTypes[Math.floor(Math.random() * fishTypes.length)];
                fish.style.top = Math.random() * 70 + 15 + '%';
                fish.style.animationDelay = Math.random() * 10 + 's';
                fish.style.animationDuration = (Math.random() * 10 + 15) + 's';
                document.body.appendChild(fish);
            }
            
            for (let i = 0; i < 4; i++) {
                const fish = document.createElement('div');
                fish.className = 'fish-left';
                fish.textContent = fishTypes[Math.floor(Math.random() * fishTypes.length)];
                fish.style.top = Math.random() * 70 + 15 + '%';
                fish.style.animationDelay = Math.random() * 10 + 's';
                fish.style.animationDuration = (Math.random() * 10 + 15) + 's';
                document.body.appendChild(fish);
            }
        }
        
        createBubbles();
        createFish();
        
        // 添加练习记录
        function addPractice(minutes) {
            checkNewDay();
            
            // 每天最多10积分
            let points = Math.min(minutes, 10 - dailyScore);
            if (points <= 0) {
                alert('今天已获得满额10积分，明天再来吧！');
                return;
            }
            
            // 获取按钮位置，用于飘浮动画
            const btn = event.target;
            const rect = btn.getBoundingClientRect();
            showFloatScore(rect.left + rect.width/2, rect.top, `+${points}`);
            
            dailyScore += points;
            totalScore += points;
            
            // 记录今天练习
            const today = new Date().toISOString().split('T')[0];
            if (!practiceRecords.includes(today)) {
                practiceRecords.push(today);
                localStorage.setItem('practiceRecords', JSON.stringify(practiceRecords));
            }
            
            localStorage.setItem('dailyScore', dailyScore);
            localStorage.setItem('totalScore', totalScore);
            localStorage.setItem('lastPracticeDate', today);
            
            updateDisplay();
            renderCalendar();
            updateRewards();
            
            // 积分数字动画
            animateScore();
            
            // 检查是否获得新奖励
            checkNewReward();
            
            setTimeout(() => {
                alert(`🎉 练习${minutes}分钟！获得${points}积分！\n今日积分：${dailyScore}/10\n累计积分：${totalScore}`);
            }, 300);
        }
        
        // 显示飘浮积分
        function showFloatScore(x, y, text) {
            const floatEl = document.createElement('div');
            floatEl.className = 'score-float';
            floatEl.textContent = text;
            floatEl.style.left = x + 'px';
            floatEl.style.top = y + 'px';
            document.body.appendChild(floatEl);
            
            setTimeout(() => {
                floatEl.remove();
            }, 1000);
        }
        
        // 积分数字动画
        function animateScore() {
            const dailyEl = document.getElementById('dailyScore');
            const totalEl = document.getElementById('totalScore');
            
            dailyEl.classList.add('score-animate');
            totalEl.classList.add('score-animate');
            
            setTimeout(() => {
                dailyEl.classList.remove('score-animate');
                totalEl.classList.remove('score-animate');
            }, 600);
        }
        
        // 检查是否获得新奖励
        function checkNewReward() {
            let currentReward = rewards[0];
            for (let i = rewards.length - 1; i >= 0; i--) {
                if (totalScore >= rewards[i].score) {
                    currentReward = rewards[i];
                    break;
                }
            }
            
            const savedReward = localStorage.getItem('currentReward') || '';
            if (currentReward.name !== savedReward) {
                localStorage.setItem('currentReward', currentReward.name);
                showCelebrate('获得新奖励！', `恭喜获得 ${currentReward.icon} ${currentReward.name}！`);
            }
        }
        
        // 更新奖励显示
        function updateRewards() {
            rewards.forEach((reward, index) => {
                const el = document.getElementById(`reward${reward.score}`);
                const item = el?.parentElement;
                if (item) {
                    if (totalScore >= reward.score) {
                        item.classList.add('unlocked');
                    } else {
                        item.classList.remove('unlocked');
                    }
                }
            });
        }
        
        // 更新显示
        function updateDisplay() {
            document.getElementById('dailyScore').textContent = dailyScore;
            document.getElementById('totalScore').textContent = totalScore;
            
            // 计算当前奖励等级
            let currentReward = rewards[0];
            let nextReward = rewards[1];
            for (let i = rewards.length - 1; i >= 0; i--) {
                if (totalScore >= rewards[i].score) {
                    currentReward = rewards[i];
                    nextReward = rewards[i + 1] || rewards[i];
                    break;
                }
            }
            
            document.getElementById('currentLevel').textContent = currentReward.icon + ' ' + currentReward.title;
            
            // 计算进度到下一个奖励
            const needForNext = nextReward.score - currentReward.score;
            const progressInLevel = totalScore - currentReward.score;
            const progress = needForNext > 0 ? Math.min((progressInLevel / needForNext) * 100, 100) : 100;
            document.getElementById('expFill').style.width = progress + '%';
        }
        
        // 渲染日历
        function renderCalendar() {
            const calendar = document.getElementById('calendar');
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            
            // 获取月初是星期几
            const firstDay = new Date(year, month, 1).getDay();
            // 获取当月天数
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // 保留星期标题，添加日期
            let html = `
                <div class="cal-header">日</div>
                <div class="cal-header">一</div>
                <div class="cal-header">二</div>
                <div class="cal-header">三</div>
                <div class="cal-header">四</div>
                <div class="cal-header">五</div>
                <div class="cal-header">六</div>
            `;
            
            // 空白填充
            for (let i = 0; i < firstDay; i++) {
                html += '<div></div>';
            }
            
            // 日期
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isChecked = practiceRecords.includes(dateStr);
                const isToday = day === now.getDate();
                
                let className = 'cal-day';
                if (isChecked) className += ' checked';
                if (isToday) className += ' today';
                
                html += `<div class="${className}" onclick="toggleDate('${dateStr}')">${isChecked ? '✓' : day}</div>`;
            }
            
            calendar.innerHTML = html;
        }
        
        // 切换日期打卡状态（可补打卡或取消）
        function toggleDate(dateStr) {
            if (practiceRecords.includes(dateStr)) {
                // 取消打卡
                if (confirm('确定要取消这天的打卡记录吗？')) {
                    practiceRecords = practiceRecords.filter(d => d !== dateStr);
                    // 同时扣除积分（如果是今天）
                    const today = new Date().toISOString().split('T')[0];
                    if (dateStr === today && dailyScore > 0) {
                        dailyScore = 0;
                        totalScore = Math.max(0, totalScore - dailyScore);
                        localStorage.setItem('dailyScore', '0');
                        localStorage.setItem('totalScore', totalScore);
                    }
                }
            } else {
                // 补打卡
                practiceRecords.push(dateStr);
                alert('补打卡成功！');
            }
            localStorage.setItem('practiceRecords', JSON.stringify(practiceRecords));
            renderCalendar();
            updateDisplay();
            updateRewards();
        }
        
        // 显示导出弹窗
        function showExport() {
            const today = new Date().toISOString().split('T')[0];
            const currentLevel = document.getElementById('levelNum').textContent;
            const data = `日期\t累计积分\t等级\t打卡天数\t今日积分
${today}\t${totalScore}\tLv.${currentLevel}\t${practiceRecords.length}\t${dailyScore}/10`;
            
            document.getElementById('exportData').value = data;
            document.getElementById('exportModal').classList.add('show');
        }
        
        // 复制数据
        function copyData() {
            const textarea = document.getElementById('exportData');
            textarea.select();
            document.execCommand('copy');
            alert('📋 已复制！');
        }
        
        // 关闭导出
        function closeExport() {
            document.getElementById('exportModal').classList.remove('show');
        }
        
        // 初始化日历
        renderCalendar();
    </script>
</body>
</html>
